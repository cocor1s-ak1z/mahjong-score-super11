<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>麻雀収支管理</title>
<style>
/* ===== リセット ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --xl-green:    #217346;
  --xl-green2:   #185c38;
  --xl-ribbon:   #f3f2f1;
  --xl-ribbon2:  #e8e6e3;
  --xl-border:   #d0cdc9;
  --xl-border2:  #bbb8b5;
  --xl-cell:     #ffffff;
  --xl-head:     #e9ebee;
  --xl-head2:    #d6d9de;
  --xl-select:   #cce8ff;
  --xl-text:     #212121;
  --xl-text2:    #595959;
  --xl-plus:     #1a6b2a;
  --xl-minus:    #c00000;
  --xl-plus-bg:  #e2efda;
  --xl-minus-bg: #fce4d6;
  --xl-row-alt:  #f7f8fa;
  --xl-shadow:   rgba(0,0,0,.12);
  --font: -apple-system, 'Helvetica Neue', 'Segoe UI', 'Meiryo UI', Arial, sans-serif;
}

html, body {
  font-family: var(--font);
  font-size: 16px;
  background: #e8e6e3;
  color: var(--xl-text);
  min-height: 100vh;
  -webkit-text-size-adjust: 100%;
  /* iPhoneのキーボード表示時にズームしない */
}

/* ===== タイトルバー ===== */
#titlebar {
  background: var(--xl-green);
  color: #fff;
  padding: 10px 14px 8px;
  display: flex;
  align-items: center;
  gap: 8px;
  position: sticky;
  top: 0;
  z-index: 100;
}
#titlebar-name {
  font-size: 16px;
  font-weight: 700;
  flex: 1;
  text-align: center;
}
#titlebar-date { font-size: 12px; opacity: .85; white-space: nowrap; }

/* ===== リボン（PC）/ ツールバー（スマホ） ===== */
#ribbon {
  background: var(--xl-ribbon);
  border-bottom: 2px solid var(--xl-green);
  padding: 0 8px;
  display: flex;
  align-items: stretch;
  gap: 2px;
  min-height: 56px;
  overflow-x: auto;
}
.ribbon-group {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 4px 6px 2px;
  border-right: 1px solid var(--xl-border);
  gap: 3px;
  flex-shrink: 0;
}
.ribbon-group:last-child { border-right: none; }
.ribbon-group-label { font-size: 10px; color: var(--xl-text2); margin-top: 2px; }
.ribbon-btns { display: flex; gap: 3px; }

.rb {
  font-family: var(--font);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  border: 1px solid transparent;
  border-radius: 3px;
  padding: 6px 10px;
  background: transparent;
  color: var(--xl-text);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  min-width: 52px;
  transition: background .1s;
  white-space: nowrap;
  -webkit-tap-highlight-color: transparent;
}
.rb:active { background: #d0cdc9; }
.rb-icon { font-size: 22px; line-height: 1; }
.rb-green { color: var(--xl-green); }
.rb-blue  { color: #1f4e79; }
.rb-org   { color: #c55a11; }

/* スマホ：リボンをコンパクトに */
@media (max-width: 480px) {
  #ribbon { min-height: 48px; padding: 0 4px; }
  .rb { min-width: 44px; padding: 4px 8px; font-size: 11px; }
  .rb-icon { font-size: 20px; }
  .ribbon-group-label { display: none; }
}

/* ===== 数式バー ===== */
#formula-bar {
  background: var(--xl-cell);
  border-bottom: 1px solid var(--xl-border);
  padding: 4px 10px;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--xl-text2);
  min-height: 24px;
}
#formula-bar-label {
  background: var(--xl-head);
  border: 1px solid var(--xl-border2);
  border-radius: 2px;
  padding: 1px 8px;
  font-size: 11px;
  white-space: nowrap;
}
#formula-bar-sep { color: var(--xl-border2); }
#formula-bar-value { color: var(--xl-text); font-size: 12px; }

@media (max-width: 480px) {
  #formula-bar { display: none; }
}

/* ===== メイン ===== */
#main-wrap {
  max-width: 1100px;
  margin: 0 auto;
  padding: 8px 8px 0;
  /* 集計フッター分の余白 */
  padding-bottom: 4px;
}

/* ===== シートタブ ===== */
#sheet-tabs { display: flex; align-items: flex-end; }
.sheet-tab {
  font-size: 12px;
  padding: 5px 14px;
  background: var(--xl-ribbon2);
  border: 1px solid var(--xl-border);
  border-bottom: none;
  border-radius: 3px 3px 0 0;
  cursor: pointer;
  color: var(--xl-text2);
  margin-right: 2px;
}
.sheet-tab.active {
  background: var(--xl-cell);
  color: var(--xl-green);
  font-weight: 700;
  border-bottom: 1px solid var(--xl-cell);
  margin-bottom: -1px;
  z-index: 1;
}
@media (max-width: 480px) {
  #sheet-tabs { display: none; }
}

/* ===== スプレッドシート本体 ===== */
.xl-sheet {
  background: var(--xl-cell);
  border: 1px solid var(--xl-border);
  border-radius: 0 3px 3px 3px;
  overflow: hidden;
  box-shadow: 0 2px 8px var(--xl-shadow);
  margin-bottom: 8px;
  overflow-x: auto;
}
@media (max-width: 480px) {
  .xl-sheet { border-radius: 4px; }
}

/* ===== テーブル共通 ===== */
.xl-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  min-width: 340px;
}
.xl-table th {
  background: var(--xl-head);
  border: 1px solid var(--xl-border);
  padding: 6px 8px;
  text-align: center;
  font-weight: 700;
  font-size: 12px;
  color: var(--xl-text2);
  white-space: nowrap;
  user-select: none;
}
.xl-table td {
  border: 1px solid var(--xl-border);
  padding: 8px 8px;
  text-align: right;
  font-size: 14px;
  background: var(--xl-cell);
}
.xl-table td:first-child { text-align: left; }
.xl-table tr:nth-child(even) td { background: var(--xl-row-alt); }

/* 行番号列 */
.xl-rownum {
  background: var(--xl-head) !important;
  color: var(--xl-text2);
  text-align: center !important;
  font-size: 11px;
  width: 28px;
  min-width: 28px;
  border-right: 2px solid var(--xl-border2) !important;
  padding: 4px !important;
}

/* スマホ：行番号非表示 */
@media (max-width: 480px) {
  .xl-rownum { display: none; }
  .xl-table th:first-child { display: none; }
}

/* ===== 値の色 ===== */
.val-plus  { color: var(--xl-plus);  background: var(--xl-plus-bg)  !important; font-weight: 700; }
.val-minus { color: var(--xl-minus); background: var(--xl-minus-bg) !important; font-weight: 700; }
.val-zero  { color: var(--xl-text2); }
.val-bold  { font-weight: 700; }

/* ===== 荘操作ボタン ===== */
.xl-action-cell { text-align: center !important; white-space: nowrap; }
.xl-btn {
  font-family: var(--font);
  font-size: 12px;
  font-weight: 600;
  padding: 4px 10px;
  border: 1px solid var(--xl-border2);
  border-radius: 3px;
  cursor: pointer;
  background: var(--xl-ribbon);
  color: var(--xl-text);
  margin: 0 2px;
  -webkit-tap-highlight-color: transparent;
}
.xl-btn:active { background: var(--xl-head2); }
.xl-btn-red   { border-color: #c00000; color: #c00000; }
.xl-btn-red:active { background: #fce4d6; }
.xl-btn-green { border-color: var(--xl-green); color: var(--xl-green); }
.xl-btn-green:active { background: #e2efda; }

/* スマホ：ボタン大きく */
@media (max-width: 480px) {
  .xl-btn { padding: 6px 12px; font-size: 13px; }
}

/* ===== 荘追加リンク行 ===== */
.xl-add-row td { background: #f0f7f0 !important; border-top: 2px dashed #9dc3a0 !important; }
.xl-add-link {
  color: var(--xl-green);
  font-weight: 600;
  cursor: pointer;
  text-decoration: underline;
  font-size: 14px;
  background: none;
  border: none;
  font-family: var(--font);
  padding: 4px 0;
  -webkit-tap-highlight-color: transparent;
}

/* ===== 下部タブバー ===== */
#bottom-tabbar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: var(--xl-ribbon);
  border-top: 2px solid var(--xl-green);
  z-index: 95;
  display: flex;
  box-shadow: 0 -2px 8px var(--xl-shadow);
}
.bottom-tab {
  flex: 1;
  font-family: var(--font);
  font-size: 11px;
  font-weight: 600;
  padding: 8px 4px 6px;
  background: transparent;
  border: none;
  cursor: pointer;
  color: var(--xl-text2);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  -webkit-tap-highlight-color: transparent;
  border-right: 1px solid var(--xl-border);
}
.bottom-tab:last-child { border-right: none; }
.bottom-tab.active { color: var(--xl-green); background: #f0f7f0; }
.bottom-tab-icon { font-size: 20px; line-height: 1; }

/* ===== 集計パネル ===== */
#summary-area {
  position: fixed;
  bottom: 52px; left: 0; right: 0;
  background: var(--xl-cell);
  border-top: 2px solid var(--xl-green);
  z-index: 90;
  padding: 8px 10px 10px;
  box-shadow: 0 -4px 16px var(--xl-shadow);
  display: none;
  max-height: 55vh;
  overflow: hidden;
}
#summary-area.open { display: block; }
.summary-topbar {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 6px;
}
.summary-label {
  font-size: 13px;
  font-weight: 700;
  color: var(--xl-green);
  flex: 1;
}
.summary-sort-wrap { display: flex; align-items: center; gap: 4px; font-size: 12px; }
.summary-sort-wrap label { color: var(--xl-text2); }
select.xl-select {
  font-family: var(--font);
  font-size: 14px;
  background: var(--xl-cell);
  border: 1px solid var(--xl-border2);
  border-radius: 2px;
  padding: 3px 6px;
  color: var(--xl-text);
}
.summary-table-wrap { overflow-x: auto; overflow-y: auto; -webkit-overflow-scrolling: touch; max-height: calc(55vh - 50px); }

.xl-summary-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  min-width: 320px;
}
.xl-summary-table th {
  background: var(--xl-green);
  color: #fff;
  padding: 4px 8px;
  text-align: right;
  font-size: 12px;
  border: 1px solid var(--xl-green2);
  white-space: nowrap;
}
.xl-summary-table th:nth-child(1),
.xl-summary-table th:nth-child(2) { text-align: left; }
.xl-summary-table td {
  padding: 4px 8px;
  text-align: right;
  border: 1px solid var(--xl-border);
  background: var(--xl-cell);
  font-size: 13px;
}
.xl-summary-table td:first-child { text-align: center; font-size: 11px; color: var(--xl-text2); background: var(--xl-head); border-right: 2px solid var(--xl-border2); }
.xl-summary-table td:nth-child(2) { text-align: left; font-weight: 700; }
.xl-summary-table td:nth-child(3) { text-align: center; }
.xl-summary-table tr:nth-child(even) td { background: var(--xl-row-alt); }
.xl-summary-table tr:nth-child(even) td:first-child { background: var(--xl-head); }
.xl-summary-table .val-plus  { color: var(--xl-plus);  background: var(--xl-plus-bg)  !important; font-weight: 700; }
.xl-summary-table .val-minus { color: var(--xl-minus); background: var(--xl-minus-bg) !important; font-weight: 700; }

/* スマホ：集計の行番号列非表示 */
@media (max-width: 480px) {
  .xl-summary-table td:first-child,
  .xl-summary-table th:first-child { display: none; }
  .summary-label { font-size: 12px; }
}

/* ===== モーダル ===== */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.5);
  z-index: 300;
  align-items: flex-start; /* スマホは上から */
  justify-content: center;
  padding: 0;
}
.modal-overlay.open { display: flex; }

/* PCはセンター表示 */
@media (min-width: 481px) {
  .modal-overlay { align-items: center; padding: 16px; }
}

.xl-modal {
  background: var(--xl-cell);
  border: 1px solid var(--xl-border2);
  border-radius: 0 0 12px 12px; /* 上固定なので下側を丸く */
  box-shadow: 0 4px 24px rgba(0,0,0,.25);
  width: 100%;
  max-width: 100%;
  max-height: 85vh; /* キーボード分の余裕を持たせる */
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
@media (min-width: 481px) {
  .xl-modal {
    border-radius: 6px;
    max-width: 580px;
    box-shadow: 0 8px 32px rgba(0,0,0,.28);
  }
}

.xl-modal-titlebar {
  background: var(--xl-green);
  color: #fff;
  padding: 12px 14px;
  font-size: 16px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-radius: 0; /* 上固定なので角丸なし */
  position: sticky;
  top: 0;
  z-index: 1;
}
@media (min-width: 481px) {
  .xl-modal-titlebar { border-radius: 5px 5px 0 0; }
}

.xl-modal-close {
  background: none;
  border: none;
  color: #fff;
  font-size: 20px;
  cursor: pointer;
  padding: 0 4px;
  line-height: 1;
  -webkit-tap-highlight-color: transparent;
}
.xl-modal-body { padding: 14px; }
.xl-modal-footer {
  border-top: 1px solid var(--xl-border);
  padding: 10px 14px;
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  background: var(--xl-ribbon);
  position: sticky;
  bottom: 0;
}

/* ===== ダイアログボタン ===== */
.xl-dialog-btn {
  font-family: var(--font);
  font-size: 15px;
  font-weight: 600;
  padding: 10px 20px;
  border: 1px solid var(--xl-border2);
  border-radius: 4px;
  cursor: pointer;
  background: var(--xl-ribbon);
  color: var(--xl-text);
  -webkit-tap-highlight-color: transparent;
  min-height: 44px; /* タップしやすいサイズ */
}
.xl-dialog-btn:active { background: var(--xl-head2); }
.xl-dialog-btn-primary {
  background: var(--xl-green);
  color: #fff;
  border-color: var(--xl-green2);
}
.xl-dialog-btn-primary:active { background: var(--xl-green2); }

/* ===== 荘入力テーブル ===== */
.round-input-table {
  width: 100%;
  border-collapse: collapse;
  margin-bottom: 8px;
}
.round-input-table th {
  background: var(--xl-green);
  color: #fff;
  padding: 6px 6px;
  text-align: center;
  font-size: 13px;
  border: 1px solid var(--xl-green2);
}
.round-input-table td {
  border: 1px solid var(--xl-border);
  padding: 0;
  background: var(--xl-cell);
}
.round-input-table tr:nth-child(even) td { background: var(--xl-row-alt); }

/* 入力セル：フォントサイズ16px以上でiPhoneのズームを防ぐ */
.xl-input-cell {
  width: 100%;
  font-family: var(--font);
  font-size: 16px; /* ズーム防止の重要設定 */
  border: none;
  outline: none;
  padding: 10px 8px;
  background: transparent;
  color: var(--xl-text);
  text-align: right;
  -webkit-appearance: none;
  min-height: 44px;
}
.xl-input-cell:focus {
  background: var(--xl-select);
  outline: 2px solid #1a73e8;
  outline-offset: -2px;
}
.xl-select-cell {
  width: 100%;
  font-family: var(--font);
  font-size: 16px; /* ズーム防止 */
  border: none;
  outline: none;
  padding: 10px 6px;
  background: transparent;
  color: var(--xl-text);
  -webkit-appearance: none;
  min-height: 44px;
}
.xl-select-cell:focus {
  background: var(--xl-select);
  outline: 2px solid #1a73e8;
  outline-offset: -2px;
}

/* スマホ：荘入力の番号列を非表示 */
@media (max-width: 480px) {
  .round-input-table th:first-child,
  .round-input-table td:first-child { display: none; }
}

/* ===== ヒント ===== */
.xl-hint {
  font-size: 12px;
  color: var(--xl-text2);
  background: #fff8e1;
  border: 1px solid #ffe082;
  border-radius: 3px;
  padding: 6px 10px;
  margin-top: 6px;
  line-height: 1.5;
}
@media (max-width: 480px) {
  .xl-hint { display: none; } /* スマホではキーボードナビ不要なので非表示 */
}

/* ===== エラー ===== */
.xl-error {
  display: none;
  background: #fce4d6;
  border: 1px solid #c00000;
  border-radius: 3px;
  color: #c00000;
  font-size: 13px;
  font-weight: 600;
  padding: 8px 10px;
  margin-top: 8px;
}
.xl-error.show { display: block; }

/* 合計プレビュー */
#round-total-preview {
  text-align: right;
  font-size: 13px;
  color: var(--xl-text2);
  margin-top: 6px;
  padding: 4px 2px;
}

/* ===== 参加者管理 ===== */
.xl-participant-row {
  display: flex;
  align-items: center;
  border: 1px solid var(--xl-border);
  margin-bottom: 3px;
  border-radius: 3px;
  overflow: hidden;
  min-height: 44px;
}
.xl-participant-name {
  flex: 1;
  padding: 10px 12px;
  font-size: 15px;
  background: var(--xl-cell);
}
.xl-participant-row:nth-child(even) .xl-participant-name { background: var(--xl-row-alt); }
.xl-add-row-form { display: flex; gap: 8px; margin-top: 10px; }
.xl-text-input {
  flex: 1;
  font-family: var(--font);
  font-size: 16px; /* ズーム防止 */
  border: 1px solid var(--xl-border2);
  border-radius: 3px;
  padding: 10px 10px;
  outline: none;
  color: var(--xl-text);
  min-height: 44px;
}
.xl-text-input:focus { border-color: #1a73e8; }

/* ===== ステータスバー ===== */
#statusbar {
  background: var(--xl-green);
  color: rgba(255,255,255,.85);
  font-size: 11px;
  display: flex;
  align-items: center;
  padding: 3px 10px;
  gap: 14px;
}
#statusbar span { opacity: .85; }

/* スマホ：ステータスバー非表示 */
@media (max-width: 480px) {
  #statusbar { display: none; }
}

/* ===== 空状態 ===== */
.xl-empty {
  text-align: center;
  color: var(--xl-text2);
  font-size: 14px;
  padding: 30px 16px;
  font-style: italic;
}

/* body padding-bottom: タブバー分 */
body { padding-bottom: 60px; }

/* スクロールバー */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--xl-ribbon); }
::-webkit-scrollbar-thumb { background: var(--xl-border2); border-radius: 2px; }

/* iOSのsafe area対応 */
@supports (padding-bottom: env(safe-area-inset-bottom)) {
  #bottom-tabbar { padding-bottom: env(safe-area-inset-bottom); }
  body { padding-bottom: calc(60px + env(safe-area-inset-bottom)); }
}
</style>
</head>
<body>
<!-- タイトルバー -->
<div id="titlebar">
  <span><img src="https://profile-counter.glitch.me/cocor1s-ak1z/count.svg" alt="Visitor Count"></span>
  <span id="titlebar-name">麻雀収支管理</span>
  <span id="titlebar-date"></span>
</div>

<!-- リボン -->
<div id="ribbon">
  <div class="ribbon-group">
    <div class="ribbon-btns">
      <button class="rb" onclick="saveData()">
        <span class="rb-icon rb-blue">💾</span>保存
      </button>
    </div>
    <div class="ribbon-group-label">ファイル</div>
  </div>
  <div class="ribbon-group">
    <div class="ribbon-btns">
      <button class="rb" onclick="openParticipantModal()">
        <span class="rb-icon">👥</span>参加者
      </button>
      <button class="rb" onclick="openRoundModal(null)">
        <span class="rb-icon rb-green">➕</span>荘追加
      </button>
    </div>
    <div class="ribbon-group-label">データ入力</div>
  </div>
  <div class="ribbon-group">
    <div class="ribbon-btns">
      <button class="rb" onclick="exportPDF()">
        <span class="rb-icon rb-org">📄</span>PDF
      </button>
    </div>
    <div class="ribbon-group-label">出力</div>
  </div>
</div>

<!-- 数式バー（PC only） -->
<div id="formula-bar">
  <div id="formula-bar-label">麻雀収支</div>
  <span id="formula-bar-sep">│</span>
  <span id="formula-bar-value">荘一覧・集計シート</span>
</div>

<!-- メイン -->
<div id="main-wrap">
  <div id="sheet-tabs">
    <div class="sheet-tab active">📋 荘一覧</div>
    <div class="sheet-tab" style="opacity:.5;cursor:default;">📊 集計</div>
  </div>
  <div class="xl-sheet">
    <table class="xl-table" id="rounds-table">
      <thead>
        <tr>
          <th class="xl-rownum"></th>
          <th style="width:64px">荘</th>
          <th style="text-align:left;">プレイヤー</th>
          <th style="width:72px">点数計</th>
          <th style="width:64px">馬計</th>
          <th style="width:72px">チップ計</th>
          <th style="width:72px">合計</th>
          <th style="width:96px">操作</th>
        </tr>
      </thead>
      <tbody id="rounds-tbody"></tbody>
    </table>
  </div>
</div>

<!-- ステータスバー -->
<div id="statusbar">
  <span id="status-rounds">荘数: 0</span>
  <span id="status-participants">参加者: 0人</span>
  <span style="margin-left:auto;">麻雀収支管理 v1.0</span>
</div>

<!-- 集計パネル（タブで開閉） -->
<div id="summary-area">
  <div class="summary-topbar">
    <span class="summary-label">📊 集計</span>
    <div class="summary-sort-wrap">
      <label>並び順：</label>
      <select class="xl-select" id="sort-select" onchange="renderSummary()">
        <option value="grandTotal">総合計</option>
        <option value="count">参加数</option>
        <option value="scoreTotal">点数</option>
        <option value="umaTotal">馬</option>
        <option value="chipTotal">チップ</option>
        <option value="name">名前</option>
      </select>
    </div>
  </div>
  <div class="summary-table-wrap">
    <table class="xl-summary-table">
      <thead>
        <tr>
          <th style="width:24px"></th>
          <th style="text-align:left;">名前</th>
          <th style="width:48px;text-align:center;">参加</th>
          <th style="width:72px">点数</th>
          <th style="width:64px">馬</th>
          <th style="width:64px">チップ</th>
          <th style="width:80px">総合計</th>
        </tr>
      </thead>
      <tbody id="summary-tbody"></tbody>
    </table>
  </div>
</div>

<!-- 下部タブバー -->
<div id="bottom-tabbar">
  <button class="bottom-tab active" id="tab-rounds" onclick="switchTab('rounds')">
    <span class="bottom-tab-icon">📋</span>荘一覧
  </button>
  <button class="bottom-tab" id="tab-summary" onclick="switchTab('summary')">
    <span class="bottom-tab-icon">📊</span>集計
  </button>
  <button class="bottom-tab" id="tab-add" onclick="openRoundModal(null)">
    <span class="bottom-tab-icon rb-green">➕</span>荘追加
  </button>
  <button class="bottom-tab" id="tab-save" onclick="saveData()">
    <span class="bottom-tab-icon">💾</span>保存
  </button>
</div>

<!-- 参加者管理モーダル -->
<div class="modal-overlay" id="participant-modal">
  <div class="xl-modal">
    <div class="xl-modal-titlebar">
      <span>👥 参加者管理</span>
      <button class="xl-modal-close" onclick="closeParticipantModal()">✕</button>
    </div>
    <div class="xl-modal-body">
      <div id="participant-list"></div>
      <div class="xl-add-row-form">
        <input type="text" class="xl-text-input" id="new-participant-name"
               placeholder="名前を入力" maxlength="20"
               onkeydown="if(event.key==='Enter') addParticipant()">
        <button class="xl-dialog-btn xl-dialog-btn-primary" onclick="addParticipant()">追加</button>
      </div>
      <div class="xl-error" id="participant-error"></div>
    </div>
    <div class="xl-modal-footer">
      <button class="xl-dialog-btn xl-dialog-btn-primary" onclick="closeParticipantModal()">閉じる</button>
    </div>
  </div>
</div>

<!-- 荘入力モーダル -->
<div class="modal-overlay" id="round-modal">
  <div class="xl-modal">
    <div class="xl-modal-titlebar">
      <span id="round-modal-title">荘入力</span>
      <button class="xl-modal-close" onclick="closeRoundModal()">✕</button>
    </div>
    <div class="xl-modal-body">
      <table class="round-input-table">
        <thead>
          <tr>
            <th style="width:28px">#</th>
            <th style="text-align:left;">プレイヤー</th>
            <th style="width:80px">点数</th>
            <th style="width:72px">馬</th>
            <th style="width:72px">チップ</th>
          </tr>
        </thead>
        <tbody id="player-rows"></tbody>
      </table>
      <div class="xl-hint">
        ⌨️ 矢印キー・Enter で点数／馬を移動　Tab でチップへ　チップ空欄 → 0 扱い
      </div>
      <div id="round-total-preview"></div>
      <div class="xl-error" id="round-error"></div>
    </div>
    <div class="xl-modal-footer">
      <button class="xl-dialog-btn" onclick="closeRoundModal()">キャンセル</button>
      <button class="xl-dialog-btn xl-dialog-btn-primary" onclick="saveRound()">💾 保存</button>
    </div>
  </div>
</div>

<script>
// ===================================================
//  状態
// ===================================================
const STORAGE_KEY = 'mahjong-score-app';
let state = { date: today(), participants: [], rounds: [] };
let editingRoundId = null;

function today() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function fmtDate(iso) { return iso ? iso.replace(/-/g, '/') : ''; }
function uid() { return Math.random().toString(36).slice(2) + Date.now().toString(36); }
function valClass(n) { return n > 0 ? 'val-plus' : n < 0 ? 'val-minus' : 'val-zero'; }
function fmtNum(n) { return n > 0 ? '+' + n : String(n); }

// ===================================================
//  LocalStorage
// ===================================================
function saveData() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    showToast('💾 保存しました');
    updateFormulaBar('保存完了 ✓');
    setTimeout(() => updateFormulaBar('荘一覧・集計シート'), 2000);
  } catch(e) {
    showToast('⚠ 保存に失敗しました');
  }
}

function showToast(msg) {
  let t = document.getElementById('toast-msg');
  if (!t) {
    t = document.createElement('div');
    t.id = 'toast-msg';
    Object.assign(t.style, {
      position: 'fixed', top: '70px', left: '50%',
      transform: 'translateX(-50%)',
      background: 'rgba(33,115,70,.95)', color: '#fff',
      padding: '10px 20px', borderRadius: '20px',
      zIndex: '9999', fontSize: '14px', fontWeight: '700',
      boxShadow: '0 4px 12px rgba(0,0,0,.25)',
      transition: 'opacity .3s', whiteSpace: 'nowrap'
    });
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = '1';
  clearTimeout(t._timer);
  t._timer = setTimeout(() => { t.style.opacity = '0'; }, 2000);
}
function loadData() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (raw) { try { state = JSON.parse(raw); } catch(e) {} }
}
function updateFormulaBar(msg) {
  const el = document.getElementById('formula-bar-value');
  if (el) el.textContent = msg;
}

// ===================================================
//  初期化
// ===================================================
function init() {
  loadData();
  if (!state.date) state.date = today();
  document.getElementById('titlebar-date').textContent = fmtDate(state.date);
  renderRounds();
  renderSummary();
  updateStatus();

}

function updateStatus() {
  document.getElementById('status-rounds').textContent = `荘数: ${state.rounds.length}`;
  document.getElementById('status-participants').textContent = `参加者: ${state.participants.length}人`;
}

// タブ切り替え
function switchTab(tab) {
  const summaryArea = document.getElementById('summary-area');
  document.querySelectorAll('.bottom-tab').forEach(t => t.classList.remove('active'));
  if (tab === 'summary') {
    summaryArea.classList.add('open');
    document.getElementById('tab-summary').classList.add('active');
    renderSummary();
  } else {
    summaryArea.classList.remove('open');
    document.getElementById('tab-rounds').classList.add('active');
  }
}

function adjustBodyPadding() {} // タブバー固定のため不要（CSS側で制御）

// ===================================================
//  荘一覧
// ===================================================
function renderRounds() {
  const tbody = document.getElementById('rounds-tbody');
  if (state.rounds.length === 0) {
    tbody.innerHTML = `<tr><td class="xl-rownum"></td><td colspan="7" class="xl-empty">荘がありません。「荘追加」から入力してください。</td></tr>`;
    updateStatus(); return;
  }
  tbody.innerHTML = state.rounds.map((r, idx) => {
    const names = r.players.map(p => {
      const pt = state.participants.find(x => x.id === p.participantId);
      return pt ? pt.name : '?';
    }).join('・');
    const scoreSum = r.players.reduce((s, p) => s + p.point, 0);
    const umaSum   = r.players.reduce((s, p) => s + p.uma, 0);
    const chipSum  = r.players.reduce((s, p) => s + p.chipCount * 5, 0);
    const total    = scoreSum + umaSum + chipSum;
    return `<tr>
      <td class="xl-rownum">${idx + 1}</td>
      <td style="font-weight:700;color:var(--xl-green);white-space:nowrap;">第${r.roundNo}荘</td>
      <td style="text-align:left;font-size:13px;">${names}</td>
      <td class="${valClass(scoreSum)}">${fmtNum(scoreSum)}</td>
      <td class="${valClass(umaSum)}">${fmtNum(umaSum)}</td>
      <td class="${valClass(chipSum)}">${fmtNum(chipSum)}</td>
      <td class="${valClass(total)} val-bold">${fmtNum(total)}</td>
      <td class="xl-action-cell">
        <button class="xl-btn xl-btn-green" onclick="openRoundModal('${r.id}')">編集</button>
        <button class="xl-btn xl-btn-red"   onclick="deleteRound('${r.id}')">削除</button>
      </td>
    </tr>`;
  }).join('');

  tbody.innerHTML += `<tr class="xl-add-row">
    <td class="xl-rownum"></td>
    <td colspan="7" style="text-align:left;padding:6px 10px;">
      <button class="xl-add-link" onclick="openRoundModal(null)">＋ 荘を追加...</button>
    </td>
  </tr>`;
  updateStatus();
}

function deleteRound(id) {
  if (!confirm('この荘を削除しますか？')) return;
  state.rounds = state.rounds.filter(r => r.id !== id);
  renumberRounds();
  saveData(); renderRounds(); renderSummary();
}
function renumberRounds() { state.rounds.forEach((r, i) => r.roundNo = i + 1); }

// ===================================================
//  参加者管理
// ===================================================
function openParticipantModal() {
  renderParticipantList();
  document.getElementById('participant-modal').classList.add('open');
  setTimeout(() => document.getElementById('new-participant-name').focus(), 100);
}
function closeParticipantModal() {
  document.getElementById('participant-modal').classList.remove('open');
  renderSummary(); updateStatus();
}
function renderParticipantList() {
  const list = document.getElementById('participant-list');
  if (state.participants.length === 0) {
    list.innerHTML = '<div class="xl-empty">参加者が登録されていません</div>'; return;
  }
  list.innerHTML = state.participants.map((p, i) => `
    <div class="xl-participant-row">
      <div class="xl-participant-name">${i+1}. ${p.name}</div>
      <button class="xl-btn xl-btn-red" style="margin:0 8px;" onclick="deleteParticipant('${p.id}')">削除</button>
    </div>`).join('');
}
function addParticipant() {
  const input = document.getElementById('new-participant-name');
  const errEl = document.getElementById('participant-error');
  const name = input.value.trim();
  if (!name) { showErr(errEl, '名前を入力してください'); return; }
  if (state.participants.some(p => p.name === name)) { showErr(errEl, `「${name}」はすでに登録されています`); return; }
  state.participants.push({ id: uid(), name });
  input.value = ''; hideErr(errEl);
  renderParticipantList(); saveData();
}
function deleteParticipant(id) {
  const inUse = state.rounds.some(r => r.players.some(p => p.participantId === id));
  if (inUse && !confirm('この参加者は荘に登録されています。\n削除しますか？')) return;
  state.participants = state.participants.filter(p => p.id !== id);
  renderParticipantList(); saveData();
}

// ===================================================
//  荘入力モーダル
// ===================================================
function openRoundModal(roundId) {
  if (state.participants.length < 4) {
    alert('参加者を4人以上登録してから荘を追加してください');
    openParticipantModal(); return;
  }
  editingRoundId = roundId;
  const isNew = roundId === null;
  const roundNo = isNew ? state.rounds.length + 1 : state.rounds.find(r => r.id === roundId).roundNo;
  document.getElementById('round-modal-title').textContent = `第${roundNo}荘 入力`;
  document.getElementById('round-error').classList.remove('show');
  document.getElementById('round-total-preview').textContent = '';

  let existingRound = null;
  if (!isNew) {
    existingRound = state.rounds.find(r => r.id === roundId);
  } else if (state.rounds.length > 0) {
    const prev = state.rounds[state.rounds.length - 1];
    existingRound = { players: prev.players.map(p => ({ participantId: p.participantId, point: '', uma: '', chipCount: '' })) };
  }
  buildPlayerRows(existingRound);
  document.getElementById('round-modal').classList.add('open');
}
function closeRoundModal() {
  document.getElementById('round-modal').classList.remove('open');
}

function buildPlayerRows(existingRound) {
  const tbody = document.getElementById('player-rows');
  tbody.innerHTML = '';
  for (let i = 0; i < 4; i++) {
    const ep = existingRound ? existingRound.players[i] : null;

    const sel = document.createElement('select');
    sel.className = 'xl-select-cell player-select';
    sel.innerHTML = '<option value="">-- 選択 --</option>' +
      state.participants.map(p =>
        `<option value="${p.id}" ${ep && ep.participantId === p.id ? 'selected' : ''}>${p.name}</option>`
      ).join('');
    sel.addEventListener('change', updateTotalPreview);

    const point = makeNumCell('point', ep ? ep.point : '', true);
    const uma   = makeNumCell('uma',   ep ? ep.uma   : '', true);
    const chip  = makeNumCell('chip',  ep ? ep.chipCount : '', false);
    [point, uma, chip].forEach(el => el.addEventListener('input', updateTotalPreview));

    const tr = document.createElement('tr');
    const tdNum = document.createElement('td');
    tdNum.style.cssText = 'text-align:center;color:var(--xl-text2);font-size:12px;padding:4px;';
    tdNum.textContent = i + 1;
    tr.append(tdNum, wrapTd(sel), wrapTd(point), wrapTd(uma), wrapTd(chip));
    tbody.appendChild(tr);
  }
  setupGridNav();
  updateTotalPreview();
}

function makeNumCell(cls, val, arrowNav) {
  const inp = document.createElement('input');
  inp.type = 'number';
  inp.className = 'xl-input-cell ' + cls;
  inp.dataset.nav = arrowNav ? '1' : '0';
  inp.value = val === '' ? '' : val;
  inp.placeholder = '0';
  inp.inputMode = 'numeric'; // iPhoneで数字キーボードを出す
  inp.addEventListener('focus', () => inp.select());
  return inp;
}

function wrapTd(el) {
  const td = document.createElement('td');
  td.style.padding = '0';
  td.appendChild(el); return td;
}

function setupGridNav() {
  const getGrid = () => {
    const rows = document.querySelectorAll('#player-rows tr');
    return Array.from(rows).map(row => [row.querySelector('.point'), row.querySelector('.uma')]);
  };
  document.querySelectorAll('#player-rows input[data-nav="1"]').forEach(inp => {
    inp.addEventListener('keydown', e => {
      const grid = getGrid();
      let cr = -1, cc = -1;
      grid.forEach((cols, r) => cols.forEach((cell, c) => { if (cell === inp) { cr = r; cc = c; } }));
      if (cr === -1) return;
      let nr = cr, nc = cc;
      if      (e.key === 'ArrowDown' || e.key === 'Enter') { e.preventDefault(); nr = (cr + 1) % grid.length; }
      else if (e.key === 'ArrowUp')    { e.preventDefault(); nr = (cr - 1 + grid.length) % grid.length; }
      else if (e.key === 'ArrowRight') { e.preventDefault(); nc = cc + 1; if (nc >= grid[cr].length) { nc = 0; nr = (cr + 1) % grid.length; } }
      else if (e.key === 'ArrowLeft')  { e.preventDefault(); nc = cc - 1; if (nc < 0) { nc = grid[cr].length - 1; nr = (cr - 1 + grid.length) % grid.length; } }
      else return;
      const t = grid[nr][nc]; if (t) t.focus();
    });
  });
}

function updateTotalPreview() {
  const rows = document.querySelectorAll('#player-rows tr');
  let sum = 0;
  rows.forEach(row => {
    const p = parseFloat(row.querySelector('.point')?.value) || 0;
    const u = parseFloat(row.querySelector('.uma')?.value)   || 0;
    const c = parseFloat(row.querySelector('.chip')?.value)  || 0;
    sum += p + u + c * 5;
  });
  const el = document.getElementById('round-total-preview');
  const cls = sum === 0 ? 'val-zero' : (sum > 0 ? 'val-plus' : 'val-minus');
  el.innerHTML = `合計プレビュー: <span class="${cls}" style="font-weight:700;">${fmtNum(sum)}</span>`;
}

function saveRound() {
  const errEl = document.getElementById('round-error');
  hideErr(errEl);
  const rows = document.querySelectorAll('#player-rows tr');
  const players = [], usedIds = [];
  for (let i = 0; i < rows.length; i++) {
    const row = rows[i];
    const pid = row.querySelector('.player-select')?.value;
    const pt  = row.querySelector('.point')?.value;
    const um  = row.querySelector('.uma')?.value;
    const ch  = row.querySelector('.chip')?.value;
    if (!pid) { showErr(errEl, `プレイヤー${i+1}を選択してください`); return; }
    if (usedIds.includes(pid)) { showErr(errEl, '同じプレイヤーが重複しています'); return; }
    if (pt === '' || um === '') { showErr(errEl, `プレイヤー${i+1}の点数・馬を入力してください`); return; }
    usedIds.push(pid);
    players.push({ participantId: pid, point: parseFloat(pt), uma: parseFloat(um), chipCount: ch === '' ? 0 : parseFloat(ch) });
  }
  const total = players.reduce((s, p) => s + p.point + p.uma + p.chipCount * 5, 0);
  if (total !== 0) { showErr(errEl, `⚠ 合計が0ではありません　現在: ${fmtNum(total)}`); return; }
  if (editingRoundId === null) {
    state.rounds.push({ id: uid(), roundNo: state.rounds.length + 1, players });
  } else {
    const idx = state.rounds.findIndex(r => r.id === editingRoundId);
    state.rounds[idx].players = players;
  }
  closeRoundModal(); saveData(); renderRounds(); renderSummary();
}

// ===================================================
//  集計
// ===================================================
function renderSummary() {
  const sortKey = document.getElementById('sort-select').value;
  const stats = {};
  state.participants.forEach(p => { stats[p.id] = { name: p.name, count: 0, scoreTotal: 0, umaTotal: 0, chipTotal: 0, grandTotal: 0 }; });
  state.rounds.forEach(r => {
    r.players.forEach(p => {
      if (!stats[p.participantId]) return;
      const chip = p.chipCount * 5;
      stats[p.participantId].count++;
      stats[p.participantId].scoreTotal += p.point;
      stats[p.participantId].umaTotal   += p.uma;
      stats[p.participantId].chipTotal  += chip;
      stats[p.participantId].grandTotal += p.point + p.uma + chip;
    });
  });
  let rows = Object.values(stats);
  rows.sort((a, b) => sortKey === 'name' ? a.name.localeCompare(b.name, 'ja') : b[sortKey] - a[sortKey]);
  const tbody = document.getElementById('summary-tbody');
  if (rows.length === 0) {
    tbody.innerHTML = '<tr><td></td><td colspan="6" style="text-align:center;color:var(--xl-text2);font-style:italic;">参加者を登録してください</td></tr>'; return;
  }
  tbody.innerHTML = rows.map((r, i) => `
    <tr>
      <td>${i+1}</td>
      <td>${r.name}</td>
      <td>${r.count}</td>
      <td class="${valClass(r.scoreTotal)}">${fmtNum(r.scoreTotal)}</td>
      <td class="${valClass(r.umaTotal)}">${fmtNum(r.umaTotal)}</td>
      <td class="${valClass(r.chipTotal)}">${fmtNum(r.chipTotal)}</td>
      <td class="${valClass(r.grandTotal)}" style="font-weight:800;">${fmtNum(r.grandTotal)}</td>
    </tr>`).join('');
}

// ===================================================
//  PDF出力
// ===================================================
function exportPDF() {
  const w = window.open('', '_blank');
  const dateStr = fmtDate(state.date);
  let html = `<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8">
<title>麻雀収支結果 ${dateStr}</title>
<style>
  body { font-family: 'Meiryo', Arial, sans-serif; font-size: 13px; color: #111; margin: 20px; }
  h1 { font-size: 20px; margin-bottom: 4px; color: #217346; }
  h3 { font-size: 14px; margin: 14px 0 4px; color: #217346; border-left: 4px solid #217346; padding-left: 8px; }
  h2 { font-size: 16px; margin: 20px 0 6px; background: #217346; color: #fff; padding: 4px 10px; }
  table { border-collapse: collapse; width: 100%; margin-bottom: 12px; }
  th, td { border: 1px solid #bbb; padding: 5px 10px; text-align: right; font-size: 13px; }
  th { background: #e2efda; font-weight: bold; color: #217346; }
  td:first-child, th:first-child { text-align: left; }
  .plus { color: #1a6b2a; font-weight: 700; } .minus { color: #c00000; font-weight: 700; }
  @media print { button { display: none; } }
</style></head><body>
<h1>🀄 麻雀収支結果</h1><p>${dateStr}</p>
<div style="display:flex;gap:10px;margin:12px 0;">
  <button onclick="window.print()" style="padding:14px 28px;font-size:17px;font-weight:700;cursor:pointer;background:#217346;color:#fff;border:none;border-radius:6px;box-shadow:0 2px 6px rgba(0,0,0,.2);">🖨 印刷する</button>
  <button onclick="window.close()" style="padding:14px 28px;font-size:17px;font-weight:700;cursor:pointer;background:#666;color:#fff;border:none;border-radius:6px;">← 戻る</button>
</div>`;

  html += '<h2>荘別結果</h2>';
  state.rounds.forEach(r => {
    html += `<h3>第${r.roundNo}荘</h3><table><thead><tr><th>名前</th><th>点数</th><th>馬</th><th>チップ枚数</th><th>チップ点</th><th>合計</th></tr></thead><tbody>`;
    r.players.forEach(p => {
      const pt = state.participants.find(x => x.id === p.participantId);
      const cp = p.chipCount * 5; const tot = p.point + p.uma + cp;
      html += `<tr><td>${pt?pt.name:'?'}</td><td>${p.point}</td><td>${p.uma}</td><td>${p.chipCount}</td><td>${cp}</td><td class="${tot>0?'plus':tot<0?'minus':''}">${fmtNum(tot)}</td></tr>`;
    });
    html += '</tbody></table>';
  });

  const stats = {};
  state.participants.forEach(p => { stats[p.id] = { name: p.name, count: 0, scoreTotal: 0, umaTotal: 0, chipTotal: 0, grandTotal: 0 }; });
  state.rounds.forEach(r => {
    r.players.forEach(p => {
      if (!stats[p.participantId]) return;
      const chip = p.chipCount * 5;
      stats[p.participantId].count++;
      stats[p.participantId].scoreTotal += p.point;
      stats[p.participantId].umaTotal   += p.uma;
      stats[p.participantId].chipTotal  += chip;
      stats[p.participantId].grandTotal += p.point + p.uma + chip;
    });
  });
  const rows = Object.values(stats).sort((a,b) => b.grandTotal - a.grandTotal);
  html += `<h2>集計結果</h2><table><thead><tr><th>名前</th><th>参加数</th><th>点数</th><th>馬</th><th>チップ点</th><th>総合計</th></tr></thead><tbody>`;
  rows.forEach(r => {
    html += `<tr><td>${r.name}</td><td style="text-align:center;">${r.count}</td><td>${fmtNum(r.scoreTotal)}</td><td>${fmtNum(r.umaTotal)}</td><td>${fmtNum(r.chipTotal)}</td><td class="${r.grandTotal>0?'plus':r.grandTotal<0?'minus':''}"><strong>${fmtNum(r.grandTotal)}</strong></td></tr>`;
  });
  html += '</tbody></table></body></html>';
  w.document.write(html); w.document.close();
}

// ===================================================
//  エラー
// ===================================================
function showErr(el, msg) { el.textContent = msg; el.classList.add('show'); }
function hideErr(el) { el.classList.remove('show'); }

// モーダル外タップで閉じる
document.getElementById('participant-modal').addEventListener('click', function(e) { if (e.target === this) closeParticipantModal(); });
document.getElementById('round-modal').addEventListener('click', function(e) { if (e.target === this) closeRoundModal(); });

// リサイズ時にpadding再調整

// ===================================================
//  iOSキーボード対応：表示時にモーダルを押し上げる
// ===================================================
(function() {
  const initialHeight = window.innerHeight;

  function onResize() {
    const currentHeight = window.innerHeight;
    const keyboardHeight = initialHeight - currentHeight;

    // スマホ幅のみ適用
    if (window.innerWidth > 480) return;

    ['round-modal', 'participant-modal'].forEach(id => {
      const overlay = document.getElementById(id);
      if (!overlay.classList.contains('open')) return;

      const modal = overlay.querySelector('.xl-modal');
      if (keyboardHeight > 100) {
        // キーボードが出た → モーダル高さをキーボード分縮める
        modal.style.maxHeight = (currentHeight - 8) + 'px';
      } else {
        // キーボードが引っ込んだ → 元に戻す
        modal.style.maxHeight = '85vh';
      }
    });

  }

  window.addEventListener('resize', onResize);

  // フォーカス時にその入力欄が見えるようスクロール
  document.addEventListener('focusin', function(e) {
    if (window.innerWidth > 480) return;
    const tag = e.target.tagName;
    if (tag !== 'INPUT' && tag !== 'SELECT') return;
    setTimeout(() => {
      e.target.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 350); // キーボードが上がりきるのを待つ
  });
})();

init();
</script>
